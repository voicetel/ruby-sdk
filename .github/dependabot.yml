version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    environment:
      ruby_version: "3.4"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # simplecov 1.x requires Ruby >= 3.3, but this SDK supports Ruby 3.1+
      # (see the Gemfile's "~> 0.22" pin and the CI matrix). Stay on the
      # 0.x line so Dependabot can resolve under Ruby 3.1.
      - dependency-name: "simplecov"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
